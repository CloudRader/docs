name: Validate Documentation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@v5.0.1

      - name: Install dependencies
        run: mise run install

      - name: Run validation checks
        run: mise run check