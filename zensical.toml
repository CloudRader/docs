[project]
site_name = "CloudRader Docs"
repo_name = "CloudRader/docs"
repo_url = "https://github.com/CloudRader/docs"
edit_uri = "https://github.com/CloudRader/docs/edit/main/docs/"
extra_css = ["assets/stylesheets/extra.css"]

nav = [
    {"Overview" = [
        {"Introduction" = [
            "index.md",
            "overview/about.md",
            "overview/why-cloudrader.md",
        ]},
        {"Ecosystem" = [
            "ecosystem/index.md",
            "ecosystem/architecture.md",
            "ecosystem/roadmap.md",
        ]},
    ]},
    {"Projects" = [
        "projects/index.md",
        "projects/reservium/index.md",
        "projects/inventarium/index.md",
    ]},
    {"Self-Hosting" = [
        "hosting/index.md",
        "hosting/quickstart-stack.md",
        "hosting/identity-provider.md",
        "hosting/reverse-proxy.md",
        "hosting/backup-restore.md",
    ]},
    {"Contributing" = [
        "contributing/index.md",
        "contributing/standards.md",
        "contributing/workflow.md",
    ]},
]

[project.theme]
features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.top",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.prune",
    "navigation.indexes",
    "navigation.footer",

    "content.action.edit",
    "content.action.view",
    "content.tooltips",
    "content.code.copy",
]
logo = "assets/logo.png"
favicon = "assets/logo.png"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "cyan"
toggle.icon = "material/weather-night"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "cyan"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to dark mode"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.blocks.caption]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
