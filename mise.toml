[tools]
uv = "0.12.22"

[tasks.install]
description = "Install locked dependencies"
run = "uv sync --locked"

[tasks.sync]
description = "Sync dependencies without lock constraint"
run = "uv sync"

[tasks.build]
description = "Build the documentation site"
run = "uv run zensical build --clean"

[tasks.serve]
description = "Start the local documentation server"
run = "uv run zensical serve"

[tasks.pre-commit]
description = "Run all pre-commit hooks"
run = "uv run pre-commit run --all-files"

[tasks.pre-commit-install]
description = "Install pre-commit as a Git hook"
run = "uv run pre-commit install"

[tasks.check]
description = "Run all checks"
depends = ["build", "pre-commit"]

[tasks.clean]
description = "Remove generated files and caches"
run = "rm -rf .cache/ site/"
